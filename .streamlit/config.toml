# Light theme with KPMG corporate palette.
# Primary colour is KPMG Pantone 280 — official corporate blue.
[theme]
base = "light"
primaryColor = "#00338D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
