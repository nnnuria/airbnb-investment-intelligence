    <rect x="850" y="496" width="318" height="56" rx="10" fill="#FDE3F1" stroke="#EA1A8E" stroke-width="2" filter="url(#sh)"/>
    <text x="1009" y="517" text-anchor="middle" fill="#B0186B" font-weight="700" font-size="12.5">★ Financial scenario engine</text>
    <text x="1009" y="535" text-anchor="middle" fill="#B0186B" font-size="10.5">Airbnb vs Sell vs Long-term · break-even</text>
    <!-- row 2 -->
    <rect x="232" y="560" width="300" height="56" rx="10" class="box" filter="url(#sh)"/>
    <text x="382" y="581" text-anchor="middle" class="lbl" font-size="12.5">Segmentation</text>
    <text x="382" y="599" text-anchor="middle" class="mut" font-size="10.5">PCA/FA + K-means → feature &amp; benchmark</text>
    <rect x="546" y="560" width="290" height="56" rx="10" class="box" filter="url(#sh)"/>
    <text x="691" y="581" text-anchor="middle" class="lbl" font-size="12.5">Review NLP + Apriori</text>
    <text x="691" y="599" text-anchor="middle" class="mut" font-size="10.5">TF-IDF/Naïve Bayes · amenity bundles</text>
    <rect x="850" y="560" width="318" height="56" rx="10" fill="#F4F6FB" stroke="#D8DDEA" stroke-width="1.5" filter="url(#sh)"/>
    <text x="1009" y="581" text-anchor="middle" class="lbl" font-size="12.5">Yield calculator (UC1)</text>
    <text x="1009" y="599" text-anchor="middle" class="mut" font-size="10.5">reuses the revenue engine above</text>
  </g>

  <!-- DATA ENGINEERING -->
  <rect x="210" y="656" width="980" height="74" rx="14" fill="#EFF1F6" stroke="#D5DAE7" stroke-width="1.5"/>
  <text x="230" y="680" class="band">DATA ENGINEERING</text>
  <g>
    <rect x="430" y="668" width="226" height="48" rx="10" class="box" filter="url(#sh)"/>
    <text x="543" y="688" text-anchor="middle" class="lbl" font-size="12.5">Loader → ABT</text>
    <text x="543" y="705" text-anchor="middle" class="mut" font-size="10.5">3 cities · shared schema · parquet</text>
    <rect x="666" y="668" width="226" height="48" rx="10" class="box" filter="url(#sh)"/>
    <text x="779" y="688" text-anchor="middle" class="lbl" font-size="12.5">Occupancy estimator</text>
    <text x="779" y="705" text-anchor="middle" class="mut" font-size="10.5">San Francisco model</text>
    <rect x="902" y="668" width="266" height="48" rx="10" fill="#FDF1F8" stroke="#EA9ECB" stroke-width="1.5" filter="url(#sh)"/>
    <text x="1035" y="688" text-anchor="middle" fill="#9B1A66" font-weight="700" font-size="12.5">★ External-data join</text>
    <text x="1035" y="705" text-anchor="middle" fill="#9B1A66" font-size="10.5">district €/m² + long-term rent index</text>
  </g>

  <!-- DATA SOURCES -->
  <rect x="210" y="760" width="980" height="92" rx="14" fill="#E8EBF4" stroke="#CED4E4" stroke-width="1.5"/>
  <text x="230" y="784" class="band">DATA SOURCES</text>
  <g>
    <rect x="232" y="794" width="300" height="46" rx="10" class="box" filter="url(#sh)"/>
    <text x="382" y="814" text-anchor="middle" class="lbl" font-size="12.5">Inside Airbnb</text>
    <text x="382" y="831" text-anchor="middle" class="mut" font-size="10.5">listings · calendar · reviews · geojson</text>
    <rect x="546" y="794" width="290" height="46" rx="10" fill="#FDF1F8" stroke="#EA9ECB" stroke-width="1.5" filter="url(#sh)"/>
    <text x="691" y="814" text-anchor="middle" fill="#9B1A66" font-weight="700" font-size="12.5">★ External market data</text>
    <text x="691" y="831" text-anchor="middle" fill="#9B1A66" font-size="10.5">sale €/m² · long-term rent index</text>
    <rect x="850" y="794" width="318" height="46" rx="10" class="box" filter="url(#sh)"/>
    <text x="1009" y="814" text-anchor="middle" class="lbl" font-size="12.5">Regulatory corpus</text>
    <text x="1009" y="831" text-anchor="middle" class="mut" font-size="10.5">official municipal STR rules (cited)</text>
