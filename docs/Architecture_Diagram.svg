    <text x="382" y="409" text-anchor="middle" class="mut" font-size="11">revenue · yield · benchmark · SHAP "why"</text>
    <rect x="546" y="368" width="290" height="56" rx="10" class="box" filter="url(#sh)"/>
    <text x="691" y="390" text-anchor="middle" class="lbl" font-size="13">Regulatory (RAG)</text>
    <text x="691" y="409" text-anchor="middle" class="mut" font-size="11">VUT / PEUAT rules · licence risk</text>
    <rect x="850" y="368" width="318" height="56" rx="10" class="box" filter="url(#sh)"/>
    <text x="1009" y="390" text-anchor="middle" class="lbl" font-size="13">Comparables (RAG)</text>
    <text x="1009" y="409" text-anchor="middle" class="mut" font-size="11">similar performing listings · semantic + filters</text>
  </g>
