    <rect x="946" y="198" width="222" height="50" rx="10" class="box" filter="url(#sh)"/>
    <text x="1057" y="219" text-anchor="middle" class="lbl" font-size="13">Chat</text>
    <text x="1057" y="237" text-anchor="middle" class="mut" font-size="11">natural-language Q&amp;A</text>
  </g>

