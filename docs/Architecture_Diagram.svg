  <path d="M1101 336 v16 a34 8 0 0 0 68 0 v-16" fill="#15C2C2" fill-opacity="0.85"/>
  <text x="1135" y="346" text-anchor="middle" fill="#073B3B" font-weight="700" font-size="11">FAISS</text>

