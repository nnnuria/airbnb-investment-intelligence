<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="'Segoe UI','Helvetica Neue',Helvetica,sans-serif">
  <defs>
    <style>
      .title{fill:#0F1A4D;font-weight:700}
      .sub{fill:#5A6178}
      .band{fill:#0F1A4D;font-weight:700;font-size:13px;letter-spacing:1.5px}
      .box{fill:#FFFFFF;stroke:#D8DDEA;stroke-width:1.5}
      .lbl{fill:#16203F;font-weight:600}
      .mut{fill:#6B7390;font-weight:400}
      .chip{fill:#FFFFFF;stroke-width:1.5}
      .chiptxt{fill:#16203F;font-weight:600;font-size:12.5px}
      .railtitle{fill:#FFFFFF;font-weight:700;font-size:13px;letter-spacing:1px}
      .flow{stroke:#9AA3BE;stroke-width:2;fill:none;marker-end:url(#arr)}
    </style>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F1A4D" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9AA3BE"/>
    </marker>
    <linearGradient id="railL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E49C9"/><stop offset="1" stop-color="#12175C"/>
    </linearGradient>
    <linearGradient id="railR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1000" fill="#F6F8FC"/>

  <!-- Title -->
  <text x="40" y="46" class="title" font-size="27">Airbnb Investment Intelligence Platform</text>
  <text x="40" y="70" class="sub" font-size="15">Governed multi-agent decision system · Madrid · Barcelona · Málaga &#160;&#160;|&#160;&#160; KPMG Capstone 2026</text>
  <rect x="1006" y="28" width="354" height="34" rx="17" fill="#FDE3F1" stroke="#EA1A8E" stroke-width="1.5"/>
  <text x="1183" y="50" text-anchor="middle" fill="#B0186B" font-weight="700" font-size="13">★ Highlighted blocks = UC2 (built first)</text>

  <!-- ================= LEFT RAIL : MLOps ================= -->
  <rect x="28" y="150" width="158" height="720" rx="16" fill="url(#railL)" filter="url(#sh)"/>
  <text x="107" y="180" text-anchor="middle" class="railtitle">MLOps PIPELINE</text>
  <line x1="48" y1="192" x2="166" y2="192" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <g>
    <rect x="44" y="206" width="126" height="92" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="107" y="234" text-anchor="middle" class="railtitle" font-size="12">MLflow</text>
    <text x="107" y="252" text-anchor="middle" fill="#DDE3FF" font-size="11">tracking +</text>
    <text x="107" y="268" text-anchor="middle" fill="#DDE3FF" font-size="11">model registry</text>
    <text x="107" y="287" text-anchor="middle" fill="#DDE3FF" font-size="11">(versioned)</text>
  </g>
  <g>
    <rect x="44" y="312" width="126" height="74" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="107" y="340" text-anchor="middle" class="railtitle" font-size="12">FastAPI</text>
    <text x="107" y="358" text-anchor="middle" fill="#DDE3FF" font-size="11">model serving</text>
    <text x="107" y="374" text-anchor="middle" fill="#DDE3FF" font-size="11">microservices</text>
  </g>
  <g>
    <rect x="44" y="400" width="126" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="107" y="425" text-anchor="middle" class="railtitle" font-size="12">Docker</text>
    <text x="107" y="443" text-anchor="middle" fill="#DDE3FF" font-size="11">+ compose</text>
  </g>
  <g>
    <rect x="44" y="472" width="126" height="74" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="107" y="500" text-anchor="middle" class="railtitle" font-size="12">GitHub Actions</text>
    <text x="107" y="518" text-anchor="middle" fill="#DDE3FF" font-size="11">CI/CD + pytest</text>
    <text x="107" y="534" text-anchor="middle" fill="#DDE3FF" font-size="11">build &amp; deploy</text>
  </g>
  <g>
    <rect x="44" y="560" width="126" height="74" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="107" y="588" text-anchor="middle" class="railtitle" font-size="12">Evidently</text>
    <text x="107" y="606" text-anchor="middle" fill="#DDE3FF" font-size="11">data / concept</text>
    <text x="107" y="622" text-anchor="middle" fill="#DDE3FF" font-size="11">drift monitoring</text>
  </g>
  <text x="107" y="700" text-anchor="middle" fill="#C7D0FF" font-size="11" font-style="italic">cross-cutting:</text>
  <text x="107" y="718" text-anchor="middle" fill="#C7D0FF" font-size="11" font-style="italic">spans every</text>
  <text x="107" y="736" text-anchor="middle" fill="#C7D0FF" font-size="11" font-style="italic">layer of the</text>
  <text x="107" y="754" text-anchor="middle" fill="#C7D0FF" font-size="11" font-style="italic">stack</text>

