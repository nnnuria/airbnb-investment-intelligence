    <text x="1293" y="378" text-anchor="middle" class="railtitle" font-size="12">Uncertainty</text>
    <text x="1293" y="396" text-anchor="middle">P10 / P50 / P90</text>
    <text x="1293" y="412" text-anchor="middle">bands</text>
    <rect x="1230" y="438" width="126" height="70" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="1293" y="462" text-anchor="middle" class="railtitle" font-size="12">Human-in-</text>
    <text x="1293" y="480" text-anchor="middle">the-loop gate</text>
    <text x="1293" y="496" text-anchor="middle">"not advice"</text>
    <rect x="1230" y="522" width="126" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="1293" y="546" text-anchor="middle" class="railtitle" font-size="12">Model cards</text>
    <text x="1293" y="564" text-anchor="middle">+ limitations</text>
    <rect x="1230" y="592" width="126" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="1293" y="616" text-anchor="middle" class="railtitle" font-size="12">Eval harness</text>
    <text x="1293" y="634" text-anchor="middle">~20 golden Qs</text>
  </g>
  <text x="1293" y="700" text-anchor="middle" fill="#E4D6FF" font-size="11" font-style="italic">= KPMG slide 12:</text>
  <text x="1293" y="718" text-anchor="middle" fill="#E4D6FF" font-size="11" font-style="italic">"Responsible AI /</text>
  <text x="1293" y="736" text-anchor="middle" fill="#E4D6FF" font-size="11" font-style="italic">governance /</text>
  <text x="1293" y="754" text-anchor="middle" fill="#E4D6FF" font-size="11" font-style="italic">human-in-the-loop"</text>

  <!-- ================= CENTER STACK ================= -->
  <!-- connectors (request down / response up) -->
  <path class="flow" d="M690 152 L690 178"/>
  <path class="flow" d="M710 268 L710 152" marker-end="url(#arr)"/>
  <path class="flow" d="M690 256 L690 286"/>
  <path class="flow" d="M690 432 L690 462"/>
  <path class="flow" d="M690 626 L690 656"/>
  <path class="flow" d="M690 730 L690 760"/>

