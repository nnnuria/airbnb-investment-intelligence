  <text x="1170" y="486" text-anchor="end" class="mut" font-size="12">trained → logged to MLflow → served via FastAPI</text>
  <g>
    <!-- row 1 -->
    <rect x="232" y="496" width="300" height="56" rx="10" class="box" filter="url(#sh)"/>
