    <text x="1293" y="256" text-anchor="middle">output bounds</text>
    <rect x="1230" y="284" width="126" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="1293" y="308" text-anchor="middle" class="railtitle" font-size="12">Source</text>
    <text x="1293" y="326" text-anchor="middle">citations (RAG)</text>
