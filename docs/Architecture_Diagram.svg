  <!-- footer -->
  <text x="40" y="960" class="mut" font-size="12">Flow: user query → UI → Coordinator routes to agents → agents call ML services → services read the governed data layer. Response returns explainable, source-cited, with uncertainty bands.</text>
  <text x="40" y="980" class="mut" font-size="12" font-style="italic">Prediction uses one global model (segment = feature, not a router). MLOps &amp; Governance rails are cross-cutting across all layers.</text>
</svg>
