paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  regulatory: data/regulatory

cities: [madrid, barcelona, malaga]
snapshot_date: "2025-09-14"

occupancy:                  # learned LightGBM model (calendar-based); see models/occupancy.py
  avg_length_of_stay: 3     # nights/booking — finance assumption for cleaning turnovers
  # review_rate / max_occupancy retired with the San Francisco estimator.

finance:                    # editable + auditable (governance)
  cleaning_fee_per_stay_eur: 45
  management_pct: 0.20      # share of gross Airbnb revenue
  platform_fee_pct: 0.03
  vacancy_buffer_pct: 0.05
  long_term_mgmt_pct: 0.08
  income_tax_pct: 0.21

seeds:
  random_state: 42